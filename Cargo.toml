[package]
name = "keywrld"
version = "0.1.8"
edition = "2024"
rust-version = "1.92"
description = "A keyboard-shaped Hyprland system shortcut overlay"
license = "MIT"
repository = "https://github.com/mks-m/keywrld"

[dependencies]
cairo-rs = { version = "0.22.0", features = ["png"] }
gtk4 = "0.11.3"
gtk4-layer-shell = { version = "0.8.0", features = ["v1_3"] }
serde_json = "1.0.151"
